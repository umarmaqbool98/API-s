services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: marks_db
      POSTGRES_USER: marks_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - marks-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marks_user -d marks_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      ConnectionStrings__Database: "Host=db;Port=5432;Database=marks_db;Username=marks_user;Password=${POSTGRES_PASSWORD:?Copy .env.example to .env first}"
      Jwt__Key: ${JWT_KEY:?Copy .env.example to .env first}
      Jwt__Issuer: MarksApi
      Jwt__Audience: MarksApiUsers
      PassMark: 50
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  marks-data:
